{% extends "base.html" %}

{% block content %}
    <h1>Enter a game ID</h1>
    <form action="" method="post" novalidate>
        {{ form.hidden_tag() }}
          <div class="col-md-4">
            <div class="form-group">
              {{ form.game_id.label }}
              {{ form.game_id(size=32) }}
            </div>
          </div>

          <div class="col-md-4">
            <div class="input submit">
                {{ form.start_game() }}
            </div>
          </div>
    </form>
{% endblock %}
