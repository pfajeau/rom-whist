{% block content %}
<script type="text/javascript" src="//cdnjs.cloudflare.com/ajax/libs/socket.io/1.3.6/socket.io.min.js"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/cards.css') }}"/>

<!-- <script src="{{ url_for('static', filename='js/game.js') }}"></script> -->

<script type="text/javascript">

  function allowDrop(ev) {
    ev.preventDefault();
  }

  function drag(ev) {
    ev.dataTransfer.setData("text", ev.target.id);
  }

  function drop(ev) {
    ev.preventDefault();
    let type = event.dataTransfer.types[0];
    alert(type);
    var data = ev.dataTransfer.getData(type);
    alert(data)
    ev.target.appendChild(document.getElementById(data));
  }

  function RecursiveUnbind($jElement) {
      // remove this element's and all of its children's click events
      $jElement.unbind();
      $jElement.removeAttr('onclick');
      $jElement.children().each(function () {
          RecursiveUnbind($(this));
      });
  }

  document.addEventListener('DOMContentLoaded', () => {

      // Connect to websocket
      var socket = io.connect(location.protocol + '//' + document.domain + ':' + location.port);

      // When connected, configure buttons
      socket.on('connect', function() {
          // Register user
          socket.emit('join game', {data:''});

          document.getElementById("deal").onclick = function() {
            socket.emit('start round', {data:document.getElementById("nb_cards").value});
          }
      });

      socket.on('new hand', function(data) {
          $('#cards').html('');
          // $('#cards').append('<ul>');
          for (var card_index in data) {
              // $('#cards').append('<br>' + data[card])
              let card =data[card_index]
              let image = 'img/' + card + ".svg"
              // let card = data[card]
              $('#cards').append('<td>'+
                "<img id=" + card + " src={{ url_for('static', filename='') }}" +
                image + ' alt=' + card + '>' + '</td>')

              // Link click event to moving the card to the table
              document.getElementById(card).onclick = function() {
                 // $('#card-table').append("<img src={{ url_for('static', filename='') }}" +
                 // image + ' alt=' + card +'>')

                 // Remove card from hand being displayed
                 document.getElementById(card).remove()

                 // Emit an event indicating a card has been card_played
                 socket.emit('player played', {data:card});

                 // TODO: prevent player from playing again until round is finished
                 RecursiveUnbind($('#cards'));


                 // Iterate over each elements under #cards
              }
          }
      });

      socket.on('card played', function(data) {
          let player = data['player']
          let card = data['card']
          // Display card on table
          let image = 'img/' + card + ".svg"
          $('#card-table').append("<img src={{ url_for('static', filename='') }}" +
          image + ' alt=' + card +'>')
      });

      socket.on('new player', function(player_name) {
          // alert('new player joined')
          // console.log("New Player joined: " + player_name)
          $('#players').append('<td><h3>' + player_name + "</h3></td>");
      });
  });
</script>

    <h2>Game Area - Game ID: {{ session['game_id'] }} </h2>
    <div>
        <h3>Players</h3>
        <div class="table-responsive">
        <table class="table">
          <tr id="players"></tr>
          {% for player in players -%}
            <td><h3>{{ player }}</h3> </td>
          {% endfor %}
        </table>
    </div>
    <div id="card-table" ondrop="drop(event)" ondragover="allowDrop(event)"></div>

    <div>
      <form action="" method="post" novalidate>
          {{ form.hidden_tag() }}
          <div class="col-md-4">
            <div class="form-group">
              {{ form.nb_cards.label }}
              {{ form.nb_cards(size=2) }}
              <button id="deal" class="btn btn-primary" name="deal" type="button">Deal</button>
            </div>
            <br>
          </div>
      </form>
    </div>
    <p/>
    <div>
      <br/>
      <div class="table-responsive">
      <table class="table">
        <tr id="cards"></tr>
      </table>
    </div>
    </div>
