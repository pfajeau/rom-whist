<script type="text/javascript">

  var socket
  function RecursiveUnbind($jElement) {
      // remove this element's and all of its children's click events
      $jElement.unbind();
      $jElement.removeAttr('onclick');
      $jElement.children().each(function () {
          RecursiveUnbind($(this));
      });
  }

  function card_played (card) {

    // Remove card from hand being displayed
    document.getElementById(card).remove()

    // Emit an event indicating a card has been card_played
    socket.emit('player played', {data:card});

    // Prevent player from playing again until round is finished
    // Enable click on cards left in hand

    $('#cards').children().each(function(index) {
      $(this).onclick = function() {
    }});

    //RecursiveUnbind($('#cards'));
  }

  document.addEventListener('DOMContentLoaded', () => {

      // Connect to websocket
      socket = io.connect(location.protocol + '//' + document.domain + ':' + location.port);

      // When connected, configure buttons
      socket.on('connect', function() {
          // Register user
          socket.emit('join game', {data:''});

          document.getElementById("deal").onclick = function() {
            socket.emit('start hand', document.getElementById("nb_cards").value,
                                      document.getElementById("trump").value);
          }
      });

      socket.on('new hand', function(data) {
          $('#cards').html('');
          // $('#cards').append('<ul>');
          for (var card_index in data) {
              // $('#cards').append('<br>' + data[card])
              let card =data[card_index]
              let image = 'img/' + card + ".svg"
              // let card = data[card]
              $('#cards').append('<td>'+
                "<img id=" + card + " src={{ url_for('static', filename='') }}" +
                image + ' alt=' + card + '>' + '</td>')

              // Link click event to moving the card to the table
              document.getElementById(card).onclick = function() {
                  card_played(card)
              }
          }
      });

      socket.on('card played', function(data) {
          let player = data['player']
          let card = data['card']
          // Display card on table
          let image = 'img/' + card + ".svg"
          $('#card-table').append("<img src={{ url_for('static', filename='') }}" +
          image + ' alt=' + card +'>')
      });

      socket.on('new player', function(player_name) {
          // alert('new player joined')
          // console.log("New Player joined: " + player_name)
          $('#players').append('<td><h3>' + player_name + "</h3></td>");
      });

      socket.on('round ended', function(player_name) {
          alert('round ended. Winner is: ' + player_name)

          // Clear table
          $('#card-table').empty()

          // Enable click on cards left in hand
          $('#cards').children().each(function(index) {
            $(this).onclick = function() {
                card_played(card)
          }
        })
      });

  });
</script>
