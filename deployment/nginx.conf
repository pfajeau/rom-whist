user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
	# multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##
	access_log /var/log/nginx/access.log;
	gzip on;

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;

    upstream cards {
        #server unix:/home/pfajeau/dev/rom-whist/romwhist.sock fail_timeout=0;
        server  localhost:5000;
    }

   server {
        listen       80;
        listen       [::]:80 ;
        server_name  fajor.ca;

        location / {
            root /home/pfajeau/dev/html;
            index index.html;
        }

        location /chatgpt/ {
            index ChatGPT.html;
            alias /home/pfajeau/dev/chatgpt/;
        }

        # Load configuration files for the default server block.
        include /etc/nginx/default.d/*.conf;

    }

    server {
        listen       80;
        listen       [::]:80 ;
        server_name  cards.fajor.ca;

	location / {
          include proxy_params;
          proxy_set_header Cookie $http_cookie;
        
          proxy_pass http://127.0.0.1:5000;
	}

    	location /socket.io {
          include proxy_params;
        
          proxy_http_version 1.1;
        
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "Upgrade";
        
          proxy_pass http://127.0.0.1:5000/socket.io;
	}

       # Is that required? I guess different python app would require a separat$
        location /static/  {
           alias /home/pfajeau/dev/rom-whist/romwhist/ui/static/;
        }
    }
}


