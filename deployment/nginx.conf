user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
	# multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;

	##
	# Gzip Settings
	##

	gzip on;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;

    upstream cards {
        #server unix:/home/pfajeau/dev/rom-whist/romwhist.sock fail_timeout=0;
        server  fajor.ca:5000;
    }

    server {
        listen       80;
        listen       [::]:80;
        server_name  fajor.ca;

        root /home/pfajeau/dev/html;

       # Load configuration files for the default server block.
        include /etc/nginx/default.d/*.conf;

       # Is that required? I guess different python app would require a separat$
        location /static/  {
           alias /home/pfajeau/dev/rom-whist/romwhist/ui/static/;
        }
        #location /chatgpt/static/  {
        #   alias /home/pfajeau/dev/chatgpt/;
        #}
        location / {
            root /home/pfajeau/dev/html;
        }

	    location /chatgpt/ {
            index ChatGPT.html;
            alias /home/pfajeau/dev/chatgpt/;
        }

        location /cards/ {

           #alias /home/pfajeau/dev/rom-whist/romwhist/ui/templates/;

           proxy_set_header Host $http_host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
           proxy_set_header SCRIPT_NAME /cards;
           proxy_set_header X-Forwarded-Prefix "/cards";
           proxy_set_header Cookie $http_cookie;

           proxy_pass http://cards;
        }

        location /socket.io/ {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            #proxy_pass http://fajor.ca:8080;
            proxy_pass http://cards;
            #proxy_pass http://cards/socketio;
            #proxy_pass unix:/home/pfajeau/dev/rom-whist/romwhist.sock;
        }
    }
}


